name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-test:
    name: Clarinet Check & Vitest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Clarinet
        run: |
          curl -L -o clarinet.tar.gz https://github.com/hirosystems/clarinet/releases/download/v2.13.0/clarinet-linux-x64.tar.gz
          tar -xzf clarinet.tar.gz
          sudo mv ./clarinet /usr/local/bin/

      - name: Check Clarity contracts
        run: clarinet check

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Vitest Unit & Invariant Test Suites
        run: npm test
